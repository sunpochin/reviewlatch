# 檔案用途：驗證開源工具而不操作真實 PR；所在層：CI；主要關聯：tests/、package.json。
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - run: bun run test
      - run: bun run demo
      - run: bun build src/cli.ts --target=bun --outfile=/tmp/reviewlatch-cli.js
